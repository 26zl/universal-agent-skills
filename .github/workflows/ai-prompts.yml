name: AI_prompts sync

# Only pull requests trigger this workflow: it runs AI_prompts code, and a pull request's cache scope cannot reach the default branch.
on:
  pull_request:
    paths:
      - "skills/**"
      - "ai-prompts.lock"
      - ".codex-plugin/plugin.json"
      - ".github/workflows/ai-prompts.yml"

permissions:
  contents: read

jobs:
  exported:
    name: Generated skills match the recorded AI_prompts commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read the recorded commit
        id: lock
        run: |
          set -eu
          commit=$(awk '$1 == "commit" { print $2 }' ai-prompts.lock)
          case "$commit" in
            *-dirty)
              echo "::error file=ai-prompts.lock::exported from uncommitted AI_prompts changes; merge them in AI_prompts and rerun the export"
              exit 1
              ;;
          esac
          if ! printf '%s\n' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error file=ai-prompts.lock::the commit line needs a full AI_prompts commit SHA"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 26zl/AI_prompts
          ref: ${{ steps.lock.outputs.commit }}
          path: .ai-prompts
          persist-credentials: false

      - name: Export again and compare
        run: |
          set -eu
          python3 .ai-prompts/scripts/export-skills.py "$GITHUB_WORKSPACE"
          changes=$(git status --porcelain -- skills .codex-plugin/plugin.json ai-prompts.lock)
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            git diff --stat -- skills .codex-plugin/plugin.json ai-prompts.lock
            echo "::error::generated files differ from AI_prompts at the recorded commit; change them in AI_prompts and rerun scripts/export-skills.py"
            exit 1
          fi
