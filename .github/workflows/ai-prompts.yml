name: AI_prompts sync

on:
  pull_request:
    paths:
      - "skills/**"
      - "ai-prompts.lock"
      - ".codex-plugin/plugin.json"
      - ".github/workflows/ai-prompts.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "ai-prompts.lock"
      - ".codex-plugin/plugin.json"
      - ".github/workflows/ai-prompts.yml"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exported:
    name: Generated skills match the recorded AI_prompts commit
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read the recorded commit
        id: lock
        run: |
          set -eu
          commit=$(awk '$1 == "commit" { print $2 }' ai-prompts.lock)
          case "$commit" in
            *-dirty)
              echo "::error file=ai-prompts.lock::exported from uncommitted AI_prompts changes; merge them in AI_prompts and rerun the export"
              exit 1
              ;;
          esac
          if ! printf '%s\n' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error file=ai-prompts.lock::the commit line needs a full AI_prompts commit SHA"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 26zl/AI_prompts
          ref: ${{ steps.lock.outputs.commit }}
          path: .ai-prompts
          persist-credentials: false

      - name: Export again and compare
        run: |
          set -eu
          python3 .ai-prompts/scripts/export-skills.py "$GITHUB_WORKSPACE"
          changes=$(git status --porcelain -- skills .codex-plugin/plugin.json ai-prompts.lock)
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            git diff --stat -- skills .codex-plugin/plugin.json ai-prompts.lock
            echo "::error::generated files differ from AI_prompts at the recorded commit; change them in AI_prompts and rerun scripts/export-skills.py"
            exit 1
          fi

  upstream:
    name: Export the current AI_prompts
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      stale: ${{ steps.export.outputs.stale }}
      report: ${{ steps.export.outputs.report }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 26zl/AI_prompts
          path: .ai-prompts
          persist-credentials: false

      - name: Export and list what would change
        id: export
        run: |
          set -eu
          python3 .ai-prompts/scripts/export-skills.py "$GITHUB_WORKSPACE"
          changes=$(git status --porcelain -- skills .codex-plugin/plugin.json)
          if [ -z "$changes" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          commit=$(git -C .ai-prompts rev-parse HEAD)
          {
            echo "## AI_prompts changes not yet exported"
            echo
            echo "AI_prompts is at \`$commit\`. Exporting it changes these files here:"
            echo
            echo '```'
            printf '%s\n' "$changes"
            echo '```'
            echo
            echo "Run \`scripts/export-skills.py <path-to-this-checkout>\` from an AI_prompts checkout at that commit and open a pull request with the result."
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo "stale=true"
            echo "report<<REPORT_END"
            cat report.md
            echo "REPORT_END"
          } >> "$GITHUB_OUTPUT"

  # The job that may write issues never runs code from the other repository.
  report:
    needs: upstream
    if: needs.upstream.outputs.stale == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ needs.upstream.outputs.report }}
        run: |
          set -eu
          printf '%s\n' "$REPORT" > report.md
          title="AI_prompts changes not yet exported"
          number=$(gh issue list --state open --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file report.md
          else
            gh issue create --title "$title" --body-file report.md
          fi
