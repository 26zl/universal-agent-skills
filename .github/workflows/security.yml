name: Scan skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "profiles/**"
      - "scripts/sync_agent_stack.py"
      - "scripts/sync_instructions.py"
      - "scripts/sync_opencode_config.py"
      - ".github/scanners/**"
      - ".github/workflows/security.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "skills/**"
      - "profiles/**"
      - "scripts/sync_agent_stack.py"
      - "scripts/sync_instructions.py"
      - "scripts/sync_opencode_config.py"
      - ".github/scanners/**"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  cisco-skill-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"

      - name: Install locked Skill Scanner
        id: install
        run: |
          uv sync --locked --project .github/scanners/cisco-skill-scanner
          echo "$PWD/.github/scanners/cisco-skill-scanner/.venv/bin" >> "$GITHUB_PATH"

      - name: Run strict behavioral scan
        run: >-
          skill-scanner scan-all skills
          --recursive
          --use-behavioral
          --policy strict
          --fail-on-severity high
          --format sarif
          --output cisco-skill-scanner.sarif

      # Findings in the local skills must not hide the external-skill scan and its SARIF.
      - name: Materialize commit-pinned portable skills
        id: materialize
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          HOME="$RUNNER_TEMP/uas-home"
          UAS_HOME="$RUNNER_TEMP/uas-home"
          UAS_SOURCE_CACHE="$RUNNER_TEMP/uas-sources"
          python scripts/sync_agent_stack.py --component skills --apply

      - name: Scan commit-pinned portable skills
        if: ${{ !cancelled() && steps.materialize.outcome == 'success' }}
        run: >-
          skill-scanner scan-all "$RUNNER_TEMP/uas-home/.agents/skills"
          --recursive
          --use-behavioral
          --policy strict
          --fail-on-severity high
          --format sarif
          --output cisco-external-skills.sarif

      - name: Upload SARIF
        if: >-
          always() &&
          hashFiles('cisco-skill-scanner.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: cisco-skill-scanner.sarif
          category: cisco-skill-scanner

      - name: Upload external-skill SARIF
        if: >-
          always() &&
          hashFiles('cisco-external-skills.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: cisco-external-skills.sarif
          category: cisco-external-skills

  skill-lists:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.list.outputs.repository }}
      portable: ${{ steps.list.outputs.portable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Only kebab-case names reach the scan jobs, so a crafted directory name cannot alter their commands.
      - name: List repository and portable skills
        id: list
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import json
          import re
          from pathlib import Path

          name = re.compile(r"^[a-z0-9]+(?:-[a-z0-9]+)*$")
          repository = sorted(
              path.parent.name
              for path in Path("skills").glob("*/SKILL.md")
              if name.fullmatch(path.parent.name)
          )
          profile = json.loads(Path("profiles/default.json").read_text(encoding="utf-8"))
          portable = [
              skill["name"]
              for skill in profile.get("portableSkills", [])
              if name.fullmatch(str(skill.get("name", "")))
          ]
          print("repository=" + json.dumps(repository))
          print("portable=" + json.dumps(portable))
          EOF

  nvidia-skillspector:
    name: SkillSpector (${{ matrix.skill }})
    needs: skill-lists
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.skill-lists.outputs.repository) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"

      - name: Install locked SkillSpector
        run: |
          uv sync --locked --project .github/scanners/skillspector
          echo "$PWD/.github/scanners/skillspector/.venv/bin" >> "$GITHUB_PATH"

      - name: Scan without external LLM calls
        env:
          SKILL: ${{ matrix.skill }}
        run: >-
          skillspector scan "skills/$SKILL"
          --no-llm
          --format sarif
          --output "skillspector-$SKILL.sarif"

      - name: Rebase SARIF paths onto the repository
        if: ${{ !cancelled() && hashFiles(format('skillspector-{0}.sarif', matrix.skill)) != '' }}
        env:
          SKILL: ${{ matrix.skill }}
        run: >-
          python scripts/prefix_sarif.py
          "skillspector-$SKILL.sarif"
          "skills/$SKILL/"

      - name: Upload SARIF
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: "skillspector-${{ matrix.skill }}.sarif"
          category: "skillspector-${{ matrix.skill }}"

  nvidia-external-skillspector:
    name: SkillSpector (external ${{ matrix.skill }})
    needs: skill-lists
    if: needs.skill-lists.outputs.portable != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.skill-lists.outputs.portable) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"

      - name: Install locked SkillSpector
        run: |
          uv sync --locked --project .github/scanners/skillspector
          echo "$PWD/.github/scanners/skillspector/.venv/bin" >> "$GITHUB_PATH"

      - name: Materialize commit-pinned portable skills
        run: >-
          HOME="$RUNNER_TEMP/uas-home"
          UAS_HOME="$RUNNER_TEMP/uas-home"
          UAS_SOURCE_CACHE="$RUNNER_TEMP/uas-sources"
          python scripts/sync_agent_stack.py --component skills --apply

      - name: Scan without external LLM calls
        env:
          SKILL: ${{ matrix.skill }}
        run: >-
          skillspector scan "$RUNNER_TEMP/uas-home/.agents/skills/$SKILL"
          --no-llm
          --format sarif
          --output "skillspector-external-$SKILL.sarif"

      - name: Rebase SARIF paths onto the install layout
        if: ${{ !cancelled() && hashFiles(format('skillspector-external-{0}.sarif', matrix.skill)) != '' }}
        env:
          SKILL: ${{ matrix.skill }}
        run: >-
          python scripts/prefix_sarif.py
          "skillspector-external-$SKILL.sarif"
          ".agents/skills/$SKILL/"

      - name: Upload SARIF
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: "skillspector-external-${{ matrix.skill }}.sarif"
          category: "skillspector-external-${{ matrix.skill }}"
